<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password · MS Enterprises</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', Arial, sans-serif; }
        html, body { height: 100%; }

        body {
            background: #050a15;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            position: relative;
            min-height: 100vh;
        }

        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(139, 92, 246, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
            z-index: 0;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.6;
        }

        .orb-1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #8b5cf6, transparent 70%);
            top: -200px; left: -150px;
        }

        .orb-2 {
            width: 450px; height: 450px;
            background: radial-gradient(circle, #ec4899, transparent 70%);
            bottom: -180px; right: -150px;
        }

        .back-link {
            position: fixed;
            top: 26px; left: 26px;
            z-index: 100;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.25s ease;
        }

        .back-link:hover {
            background: rgba(139, 92, 246, 0.15);
            border-color: rgba(139, 92, 246, 0.4);
            color: #a78bfa;
            transform: translateX(-3px);
        }

        .card-wrap {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(50px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-wrap::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 30px;
            background: conic-gradient(from 0deg, #8b5cf6, #ec4899, #6366f1, #8b5cf6);
            z-index: -1;
            animation: spin 6s linear infinite;
            opacity: 0.7;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .card {
            background: rgba(10, 22, 40, 0.92);
            backdrop-filter: blur(30px);
            border-radius: 28px;
            padding: 44px 42px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
        }

        .header { text-align: center; margin-bottom: 30px; }

        .header .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .header h1 {
            color: white;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.55);
            font-size: 14px;
            line-height: 1.6;
        }

        .flash {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .flash.error {
            background: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .flash.success {
            background: rgba(34, 197, 94, 0.12);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .field {
            position: relative;
            margin-bottom: 18px;
        }

        .field input {
            width: 100%;
            padding: 16px 48px 16px 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .field input::placeholder { color: rgba(255, 255, 255, 0.35); }

        .field input:focus {
            background: rgba(139, 92, 246, 0.06);
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.12);
        }

        .field .icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: rgba(255, 255, 255, 0.3);
        }

        .toggle-pass {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.4);
            padding: 6px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .toggle-pass:hover {
            color: #a78bfa;
            background: rgba(139, 92, 246, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 12px 28px -10px rgba(139, 92, 246, 0.6);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 36px -12px rgba(139, 92, 246, 0.9);
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }

        .footer a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 700;
            margin-left: 4px;
        }

        .footer a:hover { text-decoration: underline; }

        @media (max-width: 520px) {
            .card { padding: 34px 24px; border-radius: 22px; }
            .header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <a href="/customer-login" class="back-link">← Back to Login</a>

    <div class="card-wrap">
        <div class="card">

            <div class="header">
                <div class="icon">🔒</div>
                <h1>Reset Password</h1>
                <p>Enter your Customer ID, registered mobile,<br>and a new password</p>
            </div>

            {% if error %}
                <div class="flash error">
                    ⚠️ {{ error }}
                </div>
            {% endif %}

            {% if success %}
                <div class="flash success">
                    ✅ {{ success }}
                </div>
            {% endif %}

            <form method="POST" action="/forgot-password">
                <div class="field">
                    <input type="text" name="customerId" placeholder="Customer ID (e.g., CUST1001)" required autofocus>
                    <span class="icon">🆔</span>
                </div>

                <div class="field">
                    <input type="tel" name="mobile" placeholder="Registered mobile number" required>
                    <span class="icon">📱</span>
                </div>

                <div class="field">
                    <input type="password" id="newPassword" name="newPassword" placeholder="New password (min 6 chars)" required minlength="6">
                    <button type="button" class="toggle-pass" onclick="toggleNewPass()" id="toggleBtn">👁️</button>
                </div>

                <button type="submit" class="submit-btn">Reset Password →</button>
            </form>

            <div class="footer">
                Remember your password?<a href="/customer-login">Back to Login</a>
            </div>

        </div>
    </div>

    <script>
        function toggleNewPass() {
            const input = document.getElementById('newPassword');
            const btn = document.getElementById('toggleBtn');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }
    </script>

</body>
</html>
